apiVersion: apps/v1
kind: Deployment
metadata:
  name: static-web-deployment
  labels:
    app: static-web
spec:
  replicas: 2  # Runs two instances of your app across your worker nodes for redundancy
  selector:
    matchLabels:
      app: static-web
  strategy:
    type: RollingUpdate  # Enables seamless zero-downtime updates when code changes
  template:
    metadata:
      labels:
        app: static-web
    spec:
      containers:
      - name: web-container
        image: asmichugh55677/static-web-app:latest  # Jenkins will dynamically change 'latest' to build numbers
        imagePullPolicy: Always
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: static-web-service
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30008  # Access your application via this external port
  selector:
    app: static-web
