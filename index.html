<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kubernetes Live Operations Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #111827;
            --border: #1f2937;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --accent-cyan: #06b6d4;
            --accent-green: #10b981;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-main);
            color: var(--text-primary);
            margin: 0;
            padding: 24px;
        }

        .header {
            text-align: center;
            margin-bottom: 32px;
        }

        .header h1 {
            color: #38bdf8;
            font-size: 2.2rem;
            margin: 0 0 8px 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
        }

        .pulse-indicator {
            width: 12px;
            height: 12px;
            background-color: var(--accent-green);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-green);
            animation: pulse-glow 2s infinite ease-in-out;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.4; transform: scale(0.9); }
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(360px, 1fr));
            gap: 24px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .chart-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease;
        }

        .chart-card:hover {
            transform: translateY(-2px);
        }

        .chart-card h3 {
            margin: 0 0 20px 0;
            color: var(--text-secondary);
            font-size: 1.1rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
        }

        .canvas-wrapper {
            position: relative;
            height: 280px;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1><div class="pulse-indicator"></div> K8s Real-Time Operations Center</h1>
        <p style="color: var(--text-secondary); margin: 0;">Live Cluster Topology & Telemetry Monitor</p>
    </div>

    <div class="dashboard-grid">
        <div class="chart-card">
            <h3>CPU Load Over Time (Timeline)</h3>
            <div class="canvas-wrapper">
                <canvas id="liveLineChart"></canvas>
            </div>
        </div>

        <div class="chart-card">
            <h3>Memory Allocation per Node</h3>
            <div class="canvas-wrapper">
                <canvas id="liveBarChart"></canvas>
            </div>
        </div>

        <div class="chart-card">
            <h3>Pod Scheduling & Node Status</h3>
            <div class="canvas-wrapper">
                <canvas id="livePieChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        // Data buffers for moving timeline
        const maxDataPoints = 15;
        const timelineLabels = Array(maxDataPoints).fill('');
        const coreLoadBuffer = Array(maxDataPoints).fill(150);

        // --- 1. Line Chart Setup ---
        const ctxLine = document.getElementById('liveLineChart').getContext('2d');
        const lineChart = new Chart(ctxLine, {
            type: 'line',
            data: {
                labels: timelineLabels,
                datasets: [{
                    label: 'Cluster Aggregated CPU (mcores)',
                    data: coreLoadBuffer,
                    borderColor: '#06b6d4',
                    backgroundColor: 'rgba(6, 182, 212, 0.05)',
                    borderWidth: 3,
                    fill: true,
                    tension: 0.4,
                    pointRadius: 2
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { min: 100, max: 800, grid: { color: '#1f2937' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false } }
                },
                plugins: { legend: { labels: { color: '#f1f5f9' } } }
            }
        });

        // --- 2. Bar Chart Setup ---
        const ctxBar = document.getElementById('liveBarChart').getContext('2d');
        const barChart = new Chart(ctxBar, {
            type: 'bar',
            data: {
                labels: ['master-node', 'worker-node-1', 'worker-node-2'],
                datasets: [{
                    label: 'Memory Resident Set (MiB)',
                    data: [1420, 1850, 920],
                    backgroundColor: ['#3b82f6', '#10b981', '#f59e0b'],
                    borderRadius: 6
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    y: { grid: { color: '#1f2937' }, ticks: { color: '#94a3b8' } },
                    x: { grid: { display: false }, ticks: { color: '#94a3b8' } }
                },
                plugins: { legend: { display: false } }
            }
        });

        // --- 3. Pie/Doughnut Chart Setup ---
        const ctxPie = document.getElementById('livePieChart').getContext('2d');
        const pieChart = new Chart(ctxPie, {
            type: 'doughnut',
            data: {
                labels: ['Active / Ready', 'Evicted / Stressed', 'System Reservation'],
                datasets: [{
                    data: [75, 10, 15],
                    backgroundColor: ['#10b981', '#ef4444', '#6366f1'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { color: '#f1f5f9', padding: 15 } }
                }
            }
        });

        // --- Real-Time Streaming Update Loop ---
        setInterval(() => {
            // Compute real-time fluctuations
            let currentCpu = coreLoadBuffer[coreLoadBuffer.length - 1];
            let rawDelta = (Math.random() * 80) - 40;
            let targetCpu = Math.max(120, Math.min(760, Math.round(currentCpu + rawDelta)));

            // Shift telemetry line pipeline data window
            coreLoadBuffer.push(targetCpu);
            coreLoadBuffer.shift();
            lineChart.update('none'); // Update without full layout snaps for fluid streaming

            // Randomize individual bars slightly to mimic thread scheduling shifting live
            barChart.data.datasets[0].data = [
                Math.floor(1400 + (Math.random() * 60 - 30)),
                Math.floor(1800 + (Math.random() * 100 - 50)),
                Math.floor(900 + (Math.random() * 40 - 20))
            ];
            barChart.update('none');

            // Shift distribution balance marginally
            let dynamicStress = Math.floor(8 + (Math.random() * 6));
            pieChart.data.datasets[0].data = [85 - dynamicStress, dynamicStress, 15];
            pieChart.update();

        }, 1500); // Shifting frequency updates fluidly every 1.5 seconds
    </script>
</body>
</html>
